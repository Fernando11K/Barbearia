name: Deploy para Firebase

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Config Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote set-url origin https://${{ secrets.ACTION_TOKEN }}@github.com/Fernando11K/Barbearia.git

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: |
          npm install -g @quasar/cli
          npm install

      - name: Renomear arquivo firebase_deploy.ts para firebase.ts
        run: |
          if [ ! -f src/boot/firebase_deploy.ts ]; then
            echo "Erro: src/boot/firebase_deploy.ts não encontrado!"
            exit 1
          fi
          mv src/boot/firebase_deploy.ts src/boot/firebase.ts
          echo "Arquivo renomeado com sucesso:"
          ls -l src/boot/

      - name: Criar arquivo de configuração do Firebase
        run: |          
          echo "${{ secrets.FIREBASE_CONFIG }}" > ./firebase_config.json

      - name: Substituir conteúdo no firebase.ts com o conteúdo de firebase_config.json
        run: |
          
          FIREBASE_CONFIG_CONTENT=$(cat ./firebase_config.json)       
          ESCAPED_CONTENT=$(printf '%s' "$FIREBASE_CONFIG_CONTENT" | tr -d '\n' | sed "s/'/\\\\'/g")             
          sed -i "s|FIREBASE_CONFIG|$ESCAPED_CONTENT|" src/boot/firebase.ts                    

          
      - name: Build Quasar App
        run: |
          quasar build -m pwa

      - name: Initialize and Configure Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
           PROJECT_ID: "barbearia-90acc"
           FIREBASE_TOKEN: ${{secrets.FIREBASE_TOKEN}}
